<!-- navidad_fx.html — Efectos navideños neón para Mi ERP.
     Solo se activa con el tema "navidad" y con ✨ encendido. -->

<style>
/* ── Visibilidad: solo en tema Navidad ── */
.navidad-fx, .adornos, .fx-toggle, .cuenta { display: none; }
[data-theme="navidad"] .fx-toggle { display: inline-flex; }
[data-theme="navidad"] .cuenta    { display: inline; }
[data-theme="navidad"]:not([data-fx="off"]) .navidad-fx { display: block; }
[data-theme="navidad"]:not([data-fx="off"]) .adornos    { display: block; }

/* ═══════════ PALETA NEÓN ═══════════ */
[data-theme="navidad"] {
    --neon-rojo:    #FF2E63;
    --neon-naranja: #FF9F1C;
    --neon-oro:     #FFE600;
    --neon-verde:   #2BFF88;
    --neon-cian:    #00F0FF;
    --neon-magenta: #FF3DF2;

    --clr-gold   : #FFE14D;
    --clr-amber  : #FFF07A;
    --clr-royal  : #FF2E63;
    --clr-sky    : #7DF9FF;
    --clr-ok     : #2BFF88;
    --clr-danger : #FF3B6B;
    --clr-bg     : #050F0A;
    --clr-surface: #0B1F17;
    --clr-ice    : #0F2A1F;
    --clr-border : #1E5A43;
    --clr-text   : #F8FFF9;
    --clr-muted  : #A8CDBB;
}

/* Fondo con resplandores de colores */
[data-theme="navidad"] body {
    background:
        radial-gradient(ellipse at 10% 0%,  rgba(255,46,99,.22),  transparent 45%),
        radial-gradient(ellipse at 90% 5%,  rgba(0,240,255,.16),  transparent 42%),
        radial-gradient(ellipse at 50% 100%, rgba(255,61,242,.14), transparent 50%),
        var(--clr-bg);
    background-attachment: fixed;
}

/* Barra: línea arcoíris neón + luces de seis colores */
[data-theme="navidad"] .erp-navbar {
    background: linear-gradient(180deg, #0F3A28 0%, #06140D 100%);
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, #FF2E63, #FF9F1C, #FFE600, #2BFF88, #00F0FF, #FF3DF2, #FF2E63) 1;
    box-shadow: 0 6px 28px rgba(255,46,99,.28), 0 0 40px rgba(0,240,255,.12);
}
[data-theme="navidad"] .erp-navbar::before {
    background:
        radial-gradient(circle at 10px 12px, #FF2E63 0 4.5px, transparent 5.5px) 0 0 / 84px 20px repeat-x,
        radial-gradient(circle at 38px 12px, #FFE600 0 4.5px, transparent 5.5px) 0 0 / 84px 20px repeat-x,
        radial-gradient(circle at 66px 12px, #00F0FF 0 4.5px, transparent 5.5px) 0 0 / 84px 20px repeat-x;
    filter: drop-shadow(0 0 5px rgba(255,255,255,.6)) drop-shadow(0 0 9px rgba(255,46,99,.7));
}
[data-theme="navidad"] .erp-navbar::after {
    background:
        radial-gradient(circle at 24px 12px, #2BFF88 0 4.5px, transparent 5.5px) 0 0 / 84px 20px repeat-x,
        radial-gradient(circle at 52px 12px, #FF3DF2 0 4.5px, transparent 5.5px) 0 0 / 84px 20px repeat-x,
        radial-gradient(circle at 80px 12px, #FF9F1C 0 4.5px, transparent 5.5px) 0 0 / 84px 20px repeat-x;
    filter: drop-shadow(0 0 5px rgba(255,255,255,.6)) drop-shadow(0 0 9px rgba(43,255,136,.7));
}
[data-theme="navidad"] .erp-brand {
    color: var(--neon-oro) !important;
    text-shadow: 0 0 6px #FFE600, 0 0 14px #FF9F1C, 0 0 28px #FF2E63;
    animation: neonTitila 3.4s infinite;
}
@keyframes neonTitila { 0%, 18%, 22%, 62%, 64%, 100% { opacity: 1; } 20%, 63% { opacity: .72; } }
[data-theme="navidad"] .erp-nav-link:hover,
[data-theme="navidad"] .erp-nav-link.active {
    box-shadow: 0 0 14px rgba(255,46,99,.75);
    text-shadow: 0 0 6px rgba(255,255,255,.7);
}

/* Títulos con arcoíris neón */
[data-theme="navidad"] .erp-page-title {
    border-bottom: 3px solid transparent;
    border-image: linear-gradient(90deg, #FF2E63, #FF9F1C, #FFE600, #2BFF88, #00F0FF, #FF3DF2) 1;
}
[data-theme="navidad"] .erp-page-title h2 {
    color: var(--neon-oro);
    text-shadow: 0 0 8px rgba(255,230,0,.8), 0 0 22px rgba(255,159,28,.55);
}

/* Tarjetas: cada una brilla de un color */
[data-theme="navidad"] .erp-card {
    --neon-rgb: 0,240,255;
    position: relative;
    background: linear-gradient(160deg, #0E2A1E 0%, #07140E 100%);
    border: 1px solid rgba(var(--neon-rgb), .6);
    box-shadow: 0 0 14px rgba(var(--neon-rgb), .28), inset 0 0 22px rgba(var(--neon-rgb), .07);
}
[data-theme="navidad"] .erp-card:nth-child(4n+2) { --neon-rgb: 255,61,242; }
[data-theme="navidad"] .erp-card:nth-child(4n+3) { --neon-rgb: 43,255,136; }
[data-theme="navidad"] .erp-card:nth-child(4n+4) { --neon-rgb: 255,46,99; }
[data-theme="navidad"] .erp-card:hover {
    border-color: rgb(var(--neon-rgb));
    box-shadow: 0 0 24px rgba(var(--neon-rgb), .6), inset 0 0 28px rgba(var(--neon-rgb), .12);
}
[data-theme="navidad"] .erp-card-header {
    border-left: 6px solid transparent;
    border-image: repeating-linear-gradient(45deg, rgb(var(--neon-rgb)) 0 8px, #F8FFF9 8px 16px) 1;
    text-shadow: 0 0 8px rgba(var(--neon-rgb), .9);
}

/* Nieve acumulada sobre las tarjetas (con brillo del color de cada una) */
[data-theme="navidad"] .erp-card::before {
    content: "";
    position: absolute; left: 16px; right: 16px; top: -9px;
    height: 10px; z-index: 2; pointer-events: none;
    background:
        linear-gradient(#F8FFF9, #F8FFF9) 0 100% / 100% 3px no-repeat,
        radial-gradient(circle at 12px 100%, #F8FFF9 0 8px, transparent 9px) 0 0 / 24px 100% repeat-x;
    filter: drop-shadow(0 0 4px rgba(var(--neon-rgb), .8));
}

/* Tablas */
[data-theme="navidad"] .erp-table thead th {
    color: var(--neon-oro);
    text-shadow: 0 0 8px rgba(255,230,0,.6);
    border-bottom: 3px solid var(--neon-rojo);
}
[data-theme="navidad"] .erp-table tbody tr:hover td { background: rgba(0,240,255,.10); }
[data-theme="navidad"] .erp-table tfoot td { text-shadow: 0 0 8px rgba(255,225,77,.7); }

/* Botones neón */
[data-theme="navidad"] .btn-erp-primary {
    background: rgba(255,225,77,.08);
    color: var(--neon-oro);
    border-color: var(--neon-oro);
    box-shadow: 0 0 10px rgba(255,230,0,.45), inset 0 0 8px rgba(255,230,0,.2);
    text-shadow: 0 0 6px rgba(255,230,0,.7);
}
[data-theme="navidad"] .btn-erp-primary:hover {
    background: var(--neon-oro); color: #0B1F17; text-shadow: none;
    box-shadow: 0 0 24px rgba(255,230,0,.9);
}
[data-theme="navidad"] .btn-erp-gold {
    background: var(--neon-verde); color: #04120B; border-color: #9CFFC8;
    box-shadow: 0 0 14px rgba(43,255,136,.7);
}
[data-theme="navidad"] .btn-erp-gold:hover { box-shadow: 0 0 26px rgba(43,255,136,1); }
[data-theme="navidad"] .btn-erp-danger {
    background: var(--neon-rojo); color: #fff; border: 2px solid #FF8FAA;
    box-shadow: 0 0 14px rgba(255,46,99,.7);
}
[data-theme="navidad"] .btn-erp-danger:hover { box-shadow: 0 0 26px rgba(255,46,99,1); }

/* Formularios y alertas */
[data-theme="navidad"] .erp-input { border-color: rgba(0,240,255,.35); }
[data-theme="navidad"] .erp-input:focus {
    border-color: var(--neon-cian);
    box-shadow: 0 0 0 3px rgba(0,240,255,.25), 0 0 16px rgba(0,240,255,.5);
}
[data-theme="navidad"] .erp-alert-success { box-shadow: 0 0 14px rgba(43,255,136,.35); }
[data-theme="navidad"] .erp-alert-danger  { box-shadow: 0 0 14px rgba(255,59,107,.35); }
[data-theme="navidad"] .erp-alert-info    { box-shadow: 0 0 14px rgba(0,240,255,.3); }
[data-theme="navidad"] a[style*="clr-royal"] { color: var(--neon-cian) !important; text-shadow: 0 0 6px rgba(0,240,255,.5); }
[data-theme="navidad"] a[style*="clr-royal"]:hover { color: var(--neon-oro) !important; }

/* Footer arcoíris + cuenta regresiva neón */
[data-theme="navidad"] .erp-footer {
    background: linear-gradient(90deg, #06140D, #0F3A28, #06140D);
    border-top: 4px solid transparent;
    border-image: linear-gradient(90deg, #FF2E63, #FF9F1C, #FFE600, #2BFF88, #00F0FF, #FF3DF2, #FF2E63) 1;
}
.cuenta { color: var(--neon-cian); font-weight: 600; text-shadow: 0 0 8px rgba(0,240,255,.85); }

/* ── Botón ✨ ── */
.fx-toggle {
    width: 32px; height: 32px; border-radius: 50%;
    align-items: center; justify-content: center;
    background: transparent; color: var(--neon-cian);
    border: 2px solid var(--neon-cian);
    box-shadow: 0 0 10px rgba(0,240,255,.6);
    font-size: .8rem; cursor: pointer;
    transition: background .2s, color .2s, opacity .2s;
}
.fx-toggle:hover { background: var(--neon-cian); color: #04120B; }
.fx-toggle[aria-pressed="false"] { opacity: .55; box-shadow: none; }

/* ── Bolas colgantes neón ── */
.adornos {
    position: absolute; left: 0; right: 0; top: 100%;
    height: 0; z-index: 6; pointer-events: none;
}
.bola {
    position: absolute; top: 3px;
    display: flex; flex-direction: column; align-items: center;
    padding: 0; border: 0; background: none;
    transform-origin: 50% 0;
    pointer-events: auto; cursor: pointer;
    animation: balanceo 4.2s ease-in-out infinite alternate;
}
.bola:hover { animation-duration: 1.1s; }
.bola .hilo { width: 1.5px; background: rgba(255,255,255,.75); }
.bola svg { display: block; filter: drop-shadow(0 0 8px currentColor) drop-shadow(0 3px 4px rgba(0,0,0,.5)); }
@keyframes balanceo { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }

/* ── Santa mascota ── */
#santaWrap {
    position: fixed; right: 18px; bottom: 0;
    width: 132px; z-index: 1600; pointer-events: none;
}
.santa-btn {
    display: block; width: 100%; padding: 0; border: 0; background: none;
    pointer-events: auto; cursor: pointer;
    transform: translateY(26%);
    transition: transform .45s cubic-bezier(.34, 1.56, .64, 1);
    animation: auraNeon 6s linear infinite;
}
.santa-btn:hover, .santa-btn:focus-visible,
#santaWrap.habla .santa-btn { transform: translateY(2%); }
.santa-btn svg { display: block; width: 100%; height: auto; overflow: visible; }
.santa-saludo {
    transform-box: fill-box; transform-origin: 50% 100%;
    animation: saludo .9s ease-in-out infinite; animation-play-state: paused;
}
.santa-btn:hover .santa-saludo, #santaWrap.habla .santa-saludo { animation-play-state: running; }
@keyframes saludo { 0%, 100% { transform: rotate(-14deg); } 50% { transform: rotate(14deg); } }

/* Aura que cambia de color */
@keyframes auraNeon {
    0%, 100% { filter: drop-shadow(0 0 10px rgba(255,46,99,.95))  drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
    20%      { filter: drop-shadow(0 0 12px rgba(255,230,0,.95))  drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
    40%      { filter: drop-shadow(0 0 12px rgba(43,255,136,.95)) drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
    60%      { filter: drop-shadow(0 0 12px rgba(0,240,255,.95))  drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
    80%      { filter: drop-shadow(0 0 12px rgba(255,61,242,.95)) drop-shadow(0 6px 10px rgba(0,0,0,.5)); }
}
.luz { animation: parpadeoLuz 1.3s ease-in-out infinite; }
@keyframes parpadeoLuz { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }

.santa-burbuja {
    position: absolute; right: 6px; bottom: calc(100% + 6px);
    width: max-content; max-width: min(250px, 70vw);
    padding: .6rem .85rem; border-radius: 14px 14px 4px 14px;
    background: #0B1F17; color: #F8FFF9;
    border: 2px solid var(--neon-cian);
    font-size: .84rem; font-weight: 500; line-height: 1.35;
    box-shadow: 0 0 18px rgba(0,240,255,.65), inset 0 0 12px rgba(0,240,255,.12);
    text-shadow: 0 0 6px rgba(0,240,255,.5);
    opacity: 0; transform: translateY(8px) scale(.96); transform-origin: 90% 100%;
    transition: opacity .25s, transform .25s; pointer-events: none;
}
.santa-burbuja::after {
    content: ""; position: absolute; right: 22px; bottom: -10px;
    border: 8px solid transparent; border-bottom: 0; border-top-color: var(--neon-cian);
}
.santa-burbuja.visible { opacity: 1; transform: none; }

/* ── Santa corredor (cruza corriendo por abajo) ── */
#santaCorre {
    position: fixed; bottom: 8px; left: 0; z-index: 1550;
    font-size: 48px; line-height: 1; cursor: pointer;
    visibility: hidden; will-change: transform;
    animation: auraNeon 4s linear infinite;
}
#santaCorre.corriendo { visibility: visible; }

/* ── Trineo volador ── */
#trineo {
    position: fixed; top: 84px; left: 0; width: 300px; z-index: 1550;
    visibility: hidden; cursor: pointer; will-change: transform;
}
#trineo.volando { visibility: visible; }
#trineo svg { display: block; width: 100%; height: auto; animation: auraNeon 5s linear infinite; }
#trineo .reno { animation: galope .5s ease-in-out infinite alternate; }
#trineo .r2 { animation-delay: .25s; }
@keyframes galope { from { transform: translateY(0); } to { transform: translateY(-4px); } }

/* ── Partículas ── */
.fx-part {
    position: fixed; z-index: 1700; pointer-events: none;
    color: #FFE600; text-shadow: 0 0 8px #FFE600, 0 0 16px #FF3DF2;
    will-change: transform, opacity;
}

/* ── Nieve (canvas) ── */
#nieve { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1500; pointer-events: none; }

@media (max-width: 640px) {
    #santaWrap { display: none !important; }
    #trineo { width: 190px; top: 70px; }
    #santaCorre { font-size: 36px; }
}
@media (prefers-reduced-motion: reduce) {
    .bola, .santa-saludo, #trineo .reno, .luz, .santa-btn,
    #santaCorre, #trineo svg, [data-theme="navidad"] .erp-brand { animation: none; }
    .santa-btn { transition: none; }
    #trineo, #nieve, #santaCorre { display: none !important; }
}
</style>

<script>
(function () {
    'use strict';
    var html     = document.documentElement;
    var raiz     = document.getElementById('navidadFx');
    var usuario  = (raiz && raiz.getAttribute('data-usuario')) || '';
    var reducir  = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ── Utilidades ── */
    function esNavidad() { return html.getAttribute('data-theme') === 'navidad'; }
    function fxActivo()  { return esNavidad() && html.getAttribute('data-fx') !== 'off'; }
    function azar(a)     { return a[Math.floor(Math.random() * a.length)]; }
    function rnd(a, b)   { return a + Math.random() * (b - a); }
    function guardar(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
    function leer(k)       { try { return localStorage.getItem(k); } catch (e) { return null; } }

    /* ── Reubicar piezas en la barra y el footer ── */
    var nav      = document.querySelector('.erp-navbar');
    var btnTema  = document.getElementById('themeBtn');
    var adornos  = document.getElementById('adornos');
    var fxBtn    = document.getElementById('fxBtn');
    var cuenta   = document.getElementById('cuentaNavidad');
    var footer   = document.querySelector('.erp-footer');
    if (nav && adornos) nav.appendChild(adornos);
    if (btnTema && fxBtn) btnTema.parentNode.insertBefore(fxBtn, btnTema);
    if (footer && cuenta) footer.appendChild(cuenta);

    /* ── Cuenta regresiva ── */
    function diasParaNavidad() {
        var hoy = new Date();
        var h0  = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
        var nav = new Date(hoy.getFullYear(), 11, 25);
        if (h0 > nav) nav = new Date(hoy.getFullYear() + 1, 11, 25);
        return Math.round((nav - h0) / 86400000);
    }
    function textoCuenta() {
        var d = diasParaNavidad();
        if (d === 0) return '¡Hoy es Navidad! 🎅';
        if (d === 1) return '¡Mañana es Navidad! 🎅';
        return 'Faltan ' + d + ' días para Navidad 🎅';
    }
    if (cuenta) cuenta.textContent = ' · ' + textoCuenta();

    /* ── Partículas: regalos, chispas, estela ── */
    function particulas(x, y, lista, n, modo) {
        if (reducir) return;
        for (var i = 0; i < n; i++) {
            var p = document.createElement('span');
            p.className = 'fx-part';
            p.textContent = azar(lista);
            p.setAttribute('aria-hidden', 'true');
            p.style.left = x + 'px';
            p.style.top  = y + 'px';
            p.style.fontSize = rnd(14, 26) + 'px';
            document.body.appendChild(p);
            var anim, dx = rnd(-90, 90);
            if (modo === 'caer') {
                var caida = window.innerHeight - y + 40;
                anim = p.animate([
                    { transform: 'translate(0,0) rotate(0deg)', opacity: 1 },
                    { transform: 'translate(' + dx + 'px,' + caida + 'px) rotate(' + rnd(-300, 300) + 'deg)', opacity: 1 }
                ], { duration: rnd(1400, 2400), delay: i * 60, easing: 'cubic-bezier(.3,0,.8,.6)', fill: 'both' });
            } else if (modo === 'estela') {
                p.style.fontSize = rnd(10, 16) + 'px';
                anim = p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: 'translate(' + rnd(-30, 0) + 'px,' + rnd(20, 50) + 'px) scale(.3)', opacity: 0 }
                ], { duration: 1100, easing: 'ease-out', fill: 'both' });
            } else {
                var ang = rnd(0, Math.PI * 2), d = rnd(30, 80);
                anim = p.animate([
                    { transform: 'translate(0,0) scale(.4)', opacity: 1 },
                    { transform: 'translate(' + Math.cos(ang) * d + 'px,' + Math.sin(ang) * d + 'px) scale(1.1)', opacity: 0 }
                ], { duration: rnd(600, 1000), easing: 'ease-out', fill: 'both' });
            }
            anim.onfinish = (function (el) { return function () { el.remove(); }; })(p);
        }
    }

    /* ── Ratón compartido (ojos de Santa y nieve) ── */
    var mx = -999, my = -999, rafOjos = false;
    var btnSanta = document.getElementById('santaBtn');
    var wrap     = document.getElementById('santaWrap');
    var burbuja  = document.getElementById('santaBurbuja');
    var pupilas  = btnSanta ? btnSanta.querySelectorAll('.pupila') : [];
    var svgSanta = btnSanta ? btnSanta.querySelector('svg') : null;

    function moverOjos() {
        rafOjos = false;
        if (!fxActivo() || !svgSanta) return;
        var r  = svgSanta.getBoundingClientRect();
        var dx = mx - (r.left + r.width * 0.5);
        var dy = my - (r.top + r.height * 0.46);
        var d  = Math.sqrt(dx * dx + dy * dy) || 1;
        var k  = Math.min(d, 200) / 200 * 2.2;
        var t  = 'translate(' + (dx / d * k).toFixed(2) + ' ' + (dy / d * k).toFixed(2) + ')';
        for (var i = 0; i < pupilas.length; i++) pupilas[i].setAttribute('transform', t);
    }
    window.addEventListener('mousemove', function (e) {
        mx = e.clientX; my = e.clientY;
        if (!rafOjos) { rafOjos = true; requestAnimationFrame(moverOjos); }
    }, { passive: true });

    /* ── Santa: frases y clic ── */
    var tHabla = null, ultima = -1;
    function frases() {
        var saludo = usuario ? '¡Feliz Navidad, ' + usuario + '! 🎅' : '¡Feliz Navidad! 🎅';
        var lista = [
            '¡Ho ho ho! 🎅', saludo, textoCuenta(),
            'Haz clic en el trineo cuando pase volando 🛷',
            'A veces salgo corriendo por abajo: ¡atrápame! 🏃',
            'Las bolas del árbol también se pueden tocar 🎄',
            'Mueve el mouse: la nieve te esquiva ❄️',
            '¡Todo se ve mejor con luces de neón! 🌈'
        ];
        var porPagina = {
            '/ventas':      ['¡Cada venta es un regalo bien entregado! 🎁', 'Más ventas, menos renos cansados 🦌'],
            '/productos':   ['Tu inventario está más ordenado que el taller de los elfos 🧝', 'Revisa el stock antes de que se acaben los regalos 📦'],
            '/clientes':    ['Los buenos clientes van directo a la lista de los amables 😇'],
            '/proveedores': ['Sin proveedores no hay regalos: ¡cuídalos! 🧝'],
            '/reportes':    ['Revisa tus reportes: yo reviso la lista de buenos y traviesos 📜']
        };
        for (var ruta in porPagina) {
            if (location.pathname.indexOf(ruta) === 0) lista = lista.concat(porPagina[ruta], porPagina[ruta]);
        }
        return lista;
    }
    function frase() {
        var lista = frases(), i;
        do { i = Math.floor(Math.random() * lista.length); } while (i === ultima && lista.length > 1);
        ultima = i;
        return lista[i];
    }
    function hablar(texto, ms) {
        if (!wrap || !burbuja || !fxActivo()) return;
        burbuja.textContent = texto;
        burbuja.classList.add('visible');
        wrap.classList.add('habla');
        clearTimeout(tHabla);
        tHabla = setTimeout(callar, ms || 4800);
    }
    function callar() {
        clearTimeout(tHabla);
        if (burbuja) burbuja.classList.remove('visible');
        if (wrap) wrap.classList.remove('habla');
    }
    if (btnSanta) {
        btnSanta.addEventListener('click', function () {
            var r = btnSanta.getBoundingClientRect();
            particulas(r.left + r.width / 2, r.top + 16, ['🎁', '⭐', '🍬', '❄️', '🔔', '🎄'], 12, 'explotar');
            hablar(azar(['¡Ho ho ho! 🎁', '¡Feliz Navidad! 🎄', frase(), frase()]));
        });
    }

    /* ── Bolas colgantes ── */
    var bolas = document.querySelectorAll('.bola');
    for (var b = 0; b < bolas.length; b++) {
        bolas[b].addEventListener('click', function () {
            var r = this.getBoundingClientRect();
            particulas(r.left + r.width / 2, r.top + r.height * 0.7, ['✨', '⭐', '✦', '❄️'], 9, 'explotar');
        });
    }

    /* ── Trineo volador ── */
    var trineo = document.getElementById('trineo');
    var tTrineo = null, animTrineo = null, tEstela = null, progActiva = false;

    function estela() {
        if (!animTrineo || !trineo) return;
        var r = trineo.getBoundingClientRect();
        particulas(r.left + r.width * 0.1, r.top + r.height * 0.78, ['✦', '✧', '·'], 1, 'estela');
    }
    function terminarVuelo() {
        clearInterval(tEstela);
        if (trineo) trineo.classList.remove('volando');
        animTrineo = null;
    }
    function volar() {
        if (!trineo || !fxActivo() || document.hidden || reducir || animTrineo) return;
        var W = window.innerWidth, ancho = trineo.offsetWidth || 300;
        var dur = W < 700 ? 11000 : 16000, n = 14, kf = [];
        for (var i = 0; i <= n; i++) {
            var f = i / n;
            kf.push({
                offset: f,
                transform: 'translate(' + (-ancho - 20 + (W + ancho + 40) * f).toFixed(1) + 'px,' +
                           (Math.sin(f * Math.PI * 3) * 22).toFixed(1) + 'px) rotate(' +
                           (Math.cos(f * Math.PI * 3) * 3).toFixed(2) + 'deg)'
            });
        }
        trineo.classList.add('volando');
        animTrineo = trineo.animate(kf, { duration: dur, easing: 'linear' });
        animTrineo.onfinish = animTrineo.oncancel = terminarVuelo;
        tEstela = setInterval(estela, 130);
        hablar('¡Mira! ¡El trineo de Santa! 🛷', 3500);
    }
    function clicTrineo() {
        var r = trineo.getBoundingClientRect();
        particulas(r.left + r.width * 0.3, r.top + r.height * 0.7, ['🎁', '🎁', '🍬', '⭐', '🔔', '🧦'], 8, 'caer');
        hablar('¡Ho ho ho! ¡Regalos para todos! 🎁', 3800);
    }
    if (trineo) {
        trineo.addEventListener('click', clicTrineo);
        trineo.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); clicTrineo(); }
        });
    }
    function programar(primera) {
        clearTimeout(tTrineo);
        tTrineo = setTimeout(function () { volar(); programar(false); }, primera ? 6000 : rnd(40000, 70000));
    }

    /* ── Santa corredor ── */
    var corre = document.getElementById('santaCorre');
    var tCorre = null, animCorre = null, tRastro = null;

    function rastro() {
        if (!animCorre || !corre) return;
        var r = corre.getBoundingClientRect();
        particulas(r.left + r.width * 0.8, r.bottom - 8, ['✨', '·', '❄️'], 1, 'estela');
    }
    function terminarCarrera() {
        clearInterval(tRastro);
        if (corre) corre.classList.remove('corriendo');
        animCorre = null;
    }
    function correr() {
        if (!corre || !fxActivo() || document.hidden || reducir || animCorre) return;
        var W = window.innerWidth, ancho = corre.offsetWidth || 56, n = 24, kf = [];
        for (var i = 0; i <= n; i++) {
            var f = i / n, s = Math.sin(f * Math.PI * 18);
            kf.push({
                offset: f,
                transform: 'translate(' + (W + 20 - (W + ancho + 40) * f).toFixed(1) + 'px,' +
                           (-Math.abs(s) * 16).toFixed(1) + 'px) rotate(' + (s * 8).toFixed(1) + 'deg)'
            });
        }
        corre.classList.add('corriendo');
        animCorre = corre.animate(kf, { duration: W < 700 ? 8000 : 11000, easing: 'linear' });
        animCorre.onfinish = animCorre.oncancel = terminarCarrera;
        tRastro = setInterval(rastro, 160);
        hablar('¡Mira, Santa va corriendo! 🏃🎅', 3200);
    }
    function clicCorre() {
        var r = corre.getBoundingClientRect();
        particulas(r.left + r.width / 2, r.top + r.height / 2, ['🎁', '⭐', '🍬', '🎄', '🔔'], 10, 'explotar');
        hablar('¡Ho ho ho! ¡Atrápame si puedes! 🏃', 3600);
    }
    if (corre) {
        corre.addEventListener('click', clicCorre);
        corre.addEventListener('keydown', function (e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); clicCorre(); }
        });
    }
    function programarCorre(primera) {
        clearTimeout(tCorre);
        tCorre = setTimeout(function () { correr(); programarCorre(false); }, primera ? 14000 : rnd(30000, 55000));
    }

    /* ── Nieve de colores que esquiva el mouse ── */
    var COLORES = ['#F8FFF9', '#F8FFF9', '#F8FFF9', '#7DF9FF', '#FF8FD8', '#FFF07A', '#8CFFB5'];
    var canvas = null, ctx = null, w = 0, h = 0, copos = [], nevando = false, lazo = false, t = 0;
    function medir() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
    function crearCopo(arriba) {
        var col = azar(COLORES);
        return { x: Math.random() * w, y: arriba ? -10 : Math.random() * h,
                 r: Math.random() * 2.6 + 0.8, v: Math.random() * 0.8 + 0.4,
                 fase: Math.random() * Math.PI * 2, col: col, glow: col !== '#F8FFF9' };
    }
    function dibujar() {
        if (!nevando || document.hidden) { lazo = false; return; }
        ctx.clearRect(0, 0, w, h);
        t += 0.01;
        for (var i = 0; i < copos.length; i++) {
            var c = copos[i];
            c.y += c.v;
            c.x += Math.sin(t + c.fase) * 0.4;
            var dx = c.x - mx, dy = c.y - my, d2 = dx * dx + dy * dy;
            if (d2 < 8100 && d2 > 1) {
                var d = Math.sqrt(d2), f = (90 - d) / 90;
                c.x += dx / d * f * 3.2;
                c.y += dy / d * f * 1.6;
            }
            if (c.x < -10) c.x = w + 10;
            if (c.x > w + 10) c.x = -10;
            if (c.y > h + 10) { copos[i] = crearCopo(true); continue; }
            ctx.shadowBlur  = c.glow ? 9 : 0;
            ctx.shadowColor = c.col;
            ctx.globalAlpha = Math.min(1, 0.4 + c.r / 4);
            ctx.fillStyle   = c.col;
            ctx.beginPath();
            ctx.arc(c.x, c.y, c.r, 0, Math.PI * 2);
            ctx.fill();
        }
        ctx.globalAlpha = 1;
        ctx.shadowBlur  = 0;
        requestAnimationFrame(dibujar);
    }
    function lazoNieve() { if (!lazo) { lazo = true; requestAnimationFrame(dibujar); } }
    function iniciarNieve() {
        if (nevando || reducir) return;
        if (!canvas) {
            canvas = document.createElement('canvas');
            canvas.id = 'nieve';
            canvas.setAttribute('aria-hidden', 'true');
            document.body.appendChild(canvas);
            ctx = canvas.getContext('2d');
            window.addEventListener('resize', medir);
        }
        canvas.style.display = 'block';
        medir();
        var cantidad = window.innerWidth < 700 ? 35 : 90;
        copos = [];
        for (var i = 0; i < cantidad; i++) copos.push(crearCopo(false));
        nevando = true;
        lazoNieve();
    }
    function detenerNieve() {
        nevando = false;
        if (canvas) canvas.style.display = 'none';
    }
    document.addEventListener('visibilitychange', function () {
        if (!document.hidden && nevando) lazoNieve();
    });

    /* ── Interruptor de efectos ✨ ── */
    var estado = leer('erpFx') === 'off' ? 'off' : 'on';
    html.setAttribute('data-fx', estado);
    if (fxBtn) {
        fxBtn.setAttribute('aria-pressed', estado === 'on' ? 'true' : 'false');
        fxBtn.addEventListener('click', function () {
            var nuevo = html.getAttribute('data-fx') === 'off' ? 'on' : 'off';
            html.setAttribute('data-fx', nuevo);
            fxBtn.setAttribute('aria-pressed', nuevo === 'on' ? 'true' : 'false');
            guardar('erpFx', nuevo);
        });
    }

    /* ── Aplicar según tema y efectos ── */
    function aplicar() {
        if (fxActivo()) {
            iniciarNieve();
            if (!progActiva) { progActiva = true; programar(true); programarCorre(true); }
        } else {
            detenerNieve();
            progActiva = false;
            clearTimeout(tTrineo);
            clearTimeout(tCorre);
            if (animTrineo) animTrineo.cancel();
            if (animCorre) animCorre.cancel();
            callar();
        }
    }
    new MutationObserver(aplicar)
        .observe(html, { attributes: true, attributeFilter: ['data-theme', 'data-fx'] });
    aplicar();

    /* ── Saludo inicial (una vez por sesión) y charla ocasional ── */
    var yaSaludo = false;
    try { yaSaludo = sessionStorage.getItem('erpSantaSaludo') === '1'; } catch (e) {}
    if (!yaSaludo) {
        setTimeout(function () {
            hablar(usuario ? '¡Ho ho ho, ' + usuario + '! Bienvenido 🎅' : '¡Ho ho ho! Bienvenido 🎅', 5200);
            try { sessionStorage.setItem('erpSantaSaludo', '1'); } catch (e) {}
        }, 2200);
    }
    setInterval(function () {
        if (fxActivo() && !document.hidden && wrap && !wrap.classList.contains('habla')) hablar(frase());
    }, 28000);
})();
</script>
